[project]
name = "library_management"
authors = [
    { name = "Library Management Contributors" }
]
description = "School library circulation for Frappe — issue/return/reissue books, bulk catalogue with ISBN lookup and QR labels, and circulation reports."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "qrcode",
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
# Provides the Student doctype and the School (branch) doctype + Student.school /
# reference_number / program fields this app reads. The School doctype + those
# fields are being contributed upstream — bump the lower bound to the release
# that includes them once the Education PR lands.
education = ">=0.0.1"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "B017", "B018", "B023", "B904", "E101", "E402", "E501",
    "E741", "F401", "F403", "F405", "F722", "W191",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
